name: LegalMind CI
on: [push, pull_request]
jobs:
  backend-regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: {POSTGRES_USER: legalmind, POSTGRES_PASSWORD: legalmind, POSTGRES_DB: legalmind}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U legalmind -d legalmind"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r backend/requirements.txt
      - run: cd backend && DATABASE_URL=postgresql+psycopg://legalmind:legalmind@localhost:5432/legalmind ADMIN_API_KEY=ci EVALUATOR_API_KEY=ci2 AUTH_SECRET=ci-secret USE_WORKER=false python -m alembic upgrade head
      - run: cd backend && PYTHONPATH=. pytest -q
  frontend-build-and-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: cd frontend && npm install
      - run: cd frontend && npm run build
      - run: cd frontend && npx playwright install --with-deps chromium
      - run: cd frontend && npm run test:e2e
